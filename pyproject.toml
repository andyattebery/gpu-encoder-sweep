[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpu-encoder-sweep"
version = "0.0.1"
description = "A measurement harness that finds the settings a GPU encoder should ship, per content class and card."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hub = ["fastapi", "uvicorn", "redis"]
node = ["httpx"]
cli = ["httpx"]

[project.scripts]
sweep = "sweep.cli.__main__:main"
sweep-node = "sweep.node.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["sweep"]

name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # hatch-vcs reads the tags and the distance; a shallow clone would version every build 0.1.dev0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --extra hub --extra cli --extra node
      - run: uv run make check
      - run: uv run make integration
        env:
          SWEEP_TEST_REDIS: redis://localhost:6379/9
